# Standard proxy headers
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

server {
    listen 80;
    server_name localhost;

    # Proxy timeouts for long-lived connections (matching prod)
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # NextAuth API routes (routed to Next.js on host machine)
    location ^~ /api/auth/ {
        proxy_pass http://host.docker.internal:3000;
    }

    # Backend API routes
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # WebSocket upgrade handling (Crucial for your real-time features)
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        proxy_connect_timeout 7d;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # Frontend (Next.js running locally via npm run dev)
    location / {
        proxy_pass http://host.docker.internal:3000;
    }
}
