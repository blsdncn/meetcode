# Standard proxy headers (Moving inside server blocks for best practice)
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# HTTPS server
server {
    listen 443 ssl;
    server_name meetcode.app www.meetcode.app;

    # SSL Configuration (Now pointing to meetcode.app)
    ssl_certificate     /etc/letsencrypt/live/meetcode.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meetcode.app/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    # Proxy timeouts for long-lived connections
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # NextAuth API routes (routed to Next.js)
    location ^~ /api/auth/ {
        proxy_pass http://frontend:3000;
    }

    # Backend API routes (routed to FastAPI)
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # WebSocket upgrade handling
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        proxy_connect_timeout 7d;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # Default to frontend
    location / {
        proxy_pass http://frontend:3000;
    }
}

# HTTP to HTTPS redirect + Certbot Challenge
server {
    listen 80;
    server_name meetcode.app www.meetcode.app;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
