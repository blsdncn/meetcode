# Meetcode Production Nginx Configuration
#
# This configuration handles:
# - HTTP to HTTPS redirection (via Certbot/LetsEncrypt)
# - TLS termination with production certificates
# - Routing to frontend/backend services
# - WebSocket upgrade for real-time features

# Standard proxy headers
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# HTTPS server
server {
    listen 443 ssl;
    server_name _; # Replace with actual domain in production

    # SSL Configuration (Certbot standard paths)
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    # Proxy timeouts for WebSocket connections
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # NextAuth API routes
    location ^~ /api/auth/ {
        proxy_pass http://frontend:3000;
    }

    # Backend API routes
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # WebSocket upgrade handling
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        # WebSocket-specific timeouts
        proxy_connect_timeout 7d;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # Everything else goes to frontend (Next.js)
    location / {
        proxy_pass http://frontend:3000;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name _;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
