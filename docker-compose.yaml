# Meetcode Development Docker Compose Configuration
# 
# This runs ALL services in Docker with HTTPS (self-signed certs).
# Before running:
#   1. Generate certs: ./init_certs.sh
#   2. Copy env templates: cp .env.backend.example .env.backend && cp .env.frontend.example .env.frontend
#
# Usage:
#   docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: meetcode-postgres
    restart: unless-stopped
    expose:
      - "5432"  # Internal only, not exposed to host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required - set in .env or environment}
      POSTGRES_DB: ${POSTGRES_DB:-meetcode}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetcode-backend
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    env_file:
      - .env.backend
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      # Allow local frontend (host) to access backend
      - CORS_ORIGINS=https://localhost,http://localhost,http://localhost:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    entrypoint: ["./entrypoint-http.sh"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meetcode-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend
    env_file:
      - .env.frontend

  nginx:
    image: nginx:alpine
    container_name: meetcode-proxy
    restart: unless-stopped
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./reverse-proxy/certs:/etc/nginx/certs:ro
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - backend
      - frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
