# Meetcode Production Docker Compose Configuration
# 
# This file is used by Cloud Build to deploy to the Compute Engine VM.
# It assumes:
# 1. Images are pulled from Google Artifact Registry.
# 2. Postgres data is persisted on a mounted Persistent Disk at /mnt/disks/pgdata.
# 3. Environment variables are managed via .env.runtime files on the VM.

services:
  db:
    image: postgres:16-alpine
    container_name: meetcode-postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-meetcode}
    volumes:
      # Mount the Persistent Disk for database persistence
      - ./pgdata_mock:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Image will be substituted by 'docker compose pull' in Cloud Build
    image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/meetcode/backend:latest
    container_name: meetcode-backend
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.backend
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/meetcode
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - SECRET_KEY_ACCESS=${SECRET_KEY_ACCESS}
      - SECRET_KEY_REFRESH=${SECRET_KEY_REFRESH}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Ensure exactly 1 worker for in-memory matchmaking singleton
    entrypoint: ["./entrypoint-http.sh"]

    # Security
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  frontend:
    image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/meetcode/frontend:latest
    container_name: meetcode-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend
    env_file:
      - .env.frontend

    # Security
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1001,gid=1001
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    environment:
    - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}

  nginx:
    image: nginx:alpine
    container_name: meetcode-proxy
    restart: unless-stopped
    volumes:
      - ./reverse-proxy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL certificates managed by Certbot on the host or via volume mount
      #- /etc/letsencrypt:/etc/letsencrypt:ro
      #- ./letsencrypt_mock:/etc/letsencrypt:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot
    container_name: meetcode-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

# No named volumes needed as we use host bind-mounts for Persistent Disk
