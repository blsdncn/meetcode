substitutions:
  _REGION: us-west1
  _AR_REPO: meetcode
  _VM: meetcode-prod
  _ZONE: us-west1-b
  _REMOTE_DIR: /opt/meetcode

steps:
  # 1. Configure Docker for Artifact Registry
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "auth-docker"
    entrypoint: "bash"
    args:
      - -c
      - |
        gcloud auth configure-docker ${_REGION}-docker.pkg.dev -q

  # 2. Build and Push Backend Image
  - name: "gcr.io/cloud-builders/docker"
    id: "build-backend"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$SHORT_SHA"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:latest"
      - "./backend"

  - name: "gcr.io/cloud-builders/docker"
    id: "push-backend"
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend", "--all-tags"]

  # 3. Build and Push Frontend Image
  # Note: NEXT_PUBLIC_API_URL and other build-time env vars should be handled if needed
  - name: "gcr.io/cloud-builders/docker"
    id: "build-frontend"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$SHORT_SHA"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:latest"
      - "./frontend"

  - name: "gcr.io/cloud-builders/docker"
    id: "push-frontend"
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend", "--all-tags"]

  # 4. Sync Config and Deploy to VM via IAP SSH
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "deploy-remote"
    entrypoint: "bash"
    args:
      - -c
      - |
        # Wait for images to be available
        sleep 5
        
        # 4a. Copy production configs to the VM
        gcloud compute scp --zone ${_ZONE} --tunnel-through-iap \
          docker-compose.prod.yml \
          reverse-proxy/nginx.prod.conf \
          ${_VM}:${_REMOTE_DIR}/

        # 4b. Pull and Restart via SSH
        gcloud compute ssh ${_VM} \
          --zone ${_ZONE} \
          --tunnel-through-iap \
          --command "
            set -e
            cd ${_REMOTE_DIR}
            
            # Export variables for Docker Compose to resolve images
            export PROJECT_ID=$PROJECT_ID
            export REGION=${_REGION}
            
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
          "

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$SHORT_SHA"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$SHORT_SHA"

options:
  logging: CLOUD_LOGGING
