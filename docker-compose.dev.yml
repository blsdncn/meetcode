# Meetcode Development Docker Compose Override
#
# Use with: docker compose -f docker-compose.prod.yml -f docker-compose.dev.yml up --build
#
# This override:
# - Builds backend locally (instead of pulling from GCP)
# - Uses HTTP-only Nginx (no SSL)
# - Exposes DB port for local fastapi dev
# - Disables frontend container (run npm run dev locally)

services:
  # Build backend locally instead of pulling from GCP Artifact Registry
  backend:
    image: meetcode-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Mount source for hot reload (optional - remove if causing issues)
    volumes:
      - ./backend/src:/app/src:ro

  # Use development Nginx config (HTTP only, routes to host machine)
  nginx:
    volumes:
      - ./reverse-proxy/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    # Allow container to reach host machine (for npm run dev)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Override depends_on - frontend runs locally, not in Docker
    depends_on:
      - backend

  # Expose DB for local backend development (fastapi dev)
  db:
    ports:
      - "5432:5432"

  # Disable frontend container - use local npm run dev instead
  frontend:
    profiles: ["donotstart"]
